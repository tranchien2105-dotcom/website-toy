name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
    - uses: actions/checkout@v4

    - name: Copy .env (safe)
      run: php -r "if (!file_exists('.env') && file_exists('.env.example')) copy('.env.example', '.env');"

    - name: Debug repo (temporary)
      run: |
        pwd
        ls -la
        if [ -f .env.example ]; then echo ".env.example exists"; else echo ".env.example missing"; fi
        php -v
        composer --version

    - name: Install Dependencies
      # Bỏ -q/--no-scripts để thấy lỗi và cho phép scripts chạy nếu cần
      run: composer install --no-ansi --no-interaction --prefer-dist --optimize-autoloader --no-progress

    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
